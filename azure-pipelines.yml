trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  buildConfiguration: Release
  sqlProject: azuredbsqlproj/azuredbsqlproj.sqlproj

stages:
  - stage: Validate
    jobs:
      - job: Build
        pool:
          vmImage: windows-latest
        steps:
          - task: UseDotNet@2
            inputs:
              packageType: sdk
              version: 10.x

          - pwsh: dotnet build $(sqlProject) --configuration $(buildConfiguration)
            displayName: Build DACPAC

          - pwsh: |
              az bicep build --file infra/main.bicep --stdout | Out-Null
              az bicep build-params --file infra/environments/development.bicepparam --stdout | Out-Null
              az bicep build-params --file infra/environments/production.bicepparam --stdout | Out-Null
            displayName: Compile Bicep

          - publish: azuredbsqlproj/bin/Release/azuredbsqlproj.dacpac
            artifact: integrated-resort-dacpac

  - stage: DeployDevelopment
    dependsOn: Validate
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - deployment: DeployDatabase
        environment: integrated-resort-development
        pool:
          vmImage: windows-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - download: current
                  artifact: integrated-resort-dacpac

                - task: AzureCLI@2
                  displayName: Deploy Azure infrastructure (Bicep)
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: pscore
                    scriptLocation: inlineScript
                    inlineScript: |
                      $ErrorActionPreference = 'Stop'
                      $PSNativeCommandUseErrorActionPreference = $true

                      az group create --name '$(azureResourceGroup)' --location '$(azureLocation)' --tags SecurityControl=Ignore --output none

                      $outputs = az deployment group create `
                        --name 'integrated-resort-$(Build.BuildId)' `
                        --resource-group '$(azureResourceGroup)' `
                        --parameters infra/environments/development.bicepparam `
                        --parameters administratorLogin='$(azurePrincipalName)' `
                                     administratorObjectId='$(azurePrincipalObjectId)' `
                        --query properties.outputs `
                        --output json | ConvertFrom-Json

                      Write-Host "##vso[task.setvariable variable=sqlServerName]$($outputs.sqlServerName.value)"
                      Write-Host "##vso[task.setvariable variable=sqlServerFqdn]$($outputs.sqlServerFullyQualifiedDomainName.value)"
                      Write-Host "##vso[task.setvariable variable=databaseName]$($outputs.databaseName.value)"

                - task: SqlAzureDacpacDeployment@1
                  name: previewScript
                  displayName: Preview database changes (script)
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    AuthenticationType: servicePrincipal
                    ServerName: $(sqlServerFqdn)
                    DatabaseName: $(databaseName)
                    deployType: DacpacTask
                    DeploymentAction: Script
                    DacpacFile: $(Pipeline.Workspace)/integrated-resort-dacpac/azuredbsqlproj.dacpac
                    AdditionalArguments: >-
                      /p:BlockOnPossibleDataLoss=true
                      /p:DropObjectsNotInSource=false
                      /v:EnvironmentName=Development
                      /v:SeedDemoData=True
                    IpDetectionMethod: AutoDetect

                - pwsh: |
                    $scriptPath = '$(previewScript.SqlDeploymentOutputFile)'
                    if (Test-Path -Path $scriptPath) {
                      Write-Host '----- Pending changes to be applied to the database -----'
                      Get-Content -Path $scriptPath
                    }
                    else {
                      Write-Host "No preview script was generated at '$scriptPath'."
                    }
                  displayName: Show pending changes

                - task: SqlAzureDacpacDeployment@1
                  displayName: Deploy DACPAC (publish)
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    AuthenticationType: servicePrincipal
                    ServerName: $(sqlServerFqdn)
                    DatabaseName: $(databaseName)
                    deployType: DacpacTask
                    DeploymentAction: Publish
                    DacpacFile: $(Pipeline.Workspace)/integrated-resort-dacpac/azuredbsqlproj.dacpac
                    AdditionalArguments: >-
                      /p:BlockOnPossibleDataLoss=true
                      /p:DropObjectsNotInSource=false
                      /v:EnvironmentName=Development
                      /v:SeedDemoData=True
                    IpDetectionMethod: AutoDetect

                - task: SqlAzureDacpacDeployment@1
                  displayName: Run smoke test
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    AuthenticationType: servicePrincipal
                    ServerName: $(sqlServerFqdn)
                    DatabaseName: $(databaseName)
                    deployType: SqlTask
                    SqlFile: tests/SmokeTest.sql
                    SqlAdditionalArguments: -AbortOnError
                    IpDetectionMethod: AutoDetect
