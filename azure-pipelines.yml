trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  buildConfiguration: Release
  sqlProject: azuredbsqlproj/azuredbsqlproj.sqlproj

stages:
  - stage: Validate
    jobs:
      - job: Build
        pool:
          vmImage: windows-latest
        steps:
          - task: UseDotNet@2
            inputs:
              packageType: sdk
              version: 10.x

          - pwsh: dotnet build $(sqlProject) --configuration $(buildConfiguration)
            displayName: Build DACPAC

          - pwsh: |
              az bicep build --file infra/main.bicep --stdout | Out-Null
              az bicep build-params --file infra/environments/development.bicepparam --stdout | Out-Null
              az bicep build-params --file infra/environments/production.bicepparam --stdout | Out-Null
            displayName: Compile Bicep

          - publish: azuredbsqlproj/bin/Release/azuredbsqlproj.dacpac
            artifact: integrated-resort-dacpac

  - stage: DeployDevelopment
    dependsOn: Validate
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - deployment: DeployDatabase
        environment: integrated-resort-development
        pool:
          vmImage: windows-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - download: current
                  artifact: integrated-resort-dacpac

                - task: UseDotNet@2
                  inputs:
                    packageType: sdk
                    version: 10.x

                - pwsh: |
                    dotnet tool install --global Microsoft.SqlPackage
                    Install-Module SqlServer -Scope CurrentUser -Force -AllowClobber
                  displayName: Install deployment tools

                - task: AzureCLI@2
                  displayName: Deploy infrastructure and DACPAC
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: pscore
                    scriptLocation: inlineScript
                    inlineScript: |
                      $ErrorActionPreference = 'Stop'
                      $PSNativeCommandUseErrorActionPreference = $true
                      az group create --name '$(azureResourceGroup)' --location '$(azureLocation)' --output none

                      $outputs = az deployment group create `
                        --name 'integrated-resort-$(Build.BuildId)' `
                        --resource-group '$(azureResourceGroup)' `
                        --parameters infra/environments/development.bicepparam `
                        --parameters administratorLogin='$(azurePrincipalName)' `
                                     administratorObjectId='$(azurePrincipalObjectId)' `
                        --query properties.outputs `
                        --output json | ConvertFrom-Json

                      $sqlServerName = $outputs.sqlServerName.value
                      $sqlServerFqdn = $outputs.sqlServerFullyQualifiedDomainName.value
                      $databaseName = $outputs.databaseName.value
                      $firewallRuleName = 'ado-$(Build.BuildId)'
                      $runnerIp = (Invoke-RestMethod -Uri 'https://api.ipify.org').Trim()

                      try {
                        az sql server firewall-rule create `
                          --resource-group '$(azureResourceGroup)' `
                          --server $sqlServerName `
                          --name $firewallRuleName `
                          --start-ip-address $runnerIp `
                          --end-ip-address $runnerIp `
                          --output none

                        $accessToken = az account get-access-token `
                          --resource 'https://database.windows.net/' `
                          --query accessToken `
                          --output tsv

                        sqlpackage `
                          /Action:Publish `
                          /SourceFile:'$(Pipeline.Workspace)/integrated-resort-dacpac/azuredbsqlproj.dacpac' `
                          /TargetServerName:$sqlServerFqdn `
                          /TargetDatabaseName:$databaseName `
                          /AccessToken:$accessToken `
                          /p:BlockOnPossibleDataLoss=True `
                          /p:DropObjectsNotInSource=False `
                          /v:EnvironmentName=Development `
                          /v:SeedDemoData=True

                        Invoke-Sqlcmd `
                          -ServerInstance $sqlServerFqdn `
                          -Database $databaseName `
                          -AccessToken $accessToken `
                          -InputFile tests/SmokeTest.sql `
                          -AbortOnError
                      }
                      finally {
                        az sql server firewall-rule delete `
                          --resource-group '$(azureResourceGroup)' `
                          --server $sqlServerName `
                          --name $firewallRuleName `
                          --output none 2>$null
                      }
